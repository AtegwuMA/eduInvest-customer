spring.application.name=eduinvest

server.port=9077

# Default: in-memory H2 so the app runs out of the box with no setup.
# Switch to Postgres for real use by uncommenting the block below and
# removing the H2 lines.
spring.datasource.url=jdbc:h2:mem:eduinvest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# spring.datasource.url=jdbc:postgresql://localhost:5432/edu_invest
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=${JWT_SECRET:eduinvest-dev-secret-key-change-this-in-production-0123456789}
app.jwt.expiration-ms=86400000

# First admin account, seeded automatically on startup if it doesn't exist yet.
app.seed-admin.email=${SEED_ADMIN_EMAIL:admin@eduinvest.local}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:ChangeMe123!}
